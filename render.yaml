# Blueprint opcional de Render. También se puede configurar a mano desde el dashboard
# (ver README). Reemplazá los nombres/URLs si tus servicios se llaman distinto.
services:
  - type: web
    name: sidequest-rosario
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://sidequest-rosario-web.onrender.com
      - key: FRONTEND_URL
        value: https://sidequest-rosario-web.onrender.com
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: web
    name: sidequest-rosario-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      # El orden importa: primero /api, después el fallback de la SPA.
      - type: rewrite
        source: /api/*
        destination: https://sidequest-rosario.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
